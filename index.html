<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 블로그 포스팅 구조화 도구</title>
<style>
    body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; max-width: 1200px; margin: 0 auto; word-break: keep-all; }
    h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #2c3e50; padding-bottom: 15px; margin-bottom: 20px; }
    .instruction { font-size: 0.95em; color: #2c3e50; background: #e8f4f8; padding: 15px; border-left: 4px solid #3498db; border-radius: 4px; margin-bottom: 25px; line-height: 1.6; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .panel { flex: 1; min-width: 300px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .panel h3 { margin-top: 0; color: #34495e; font-size: 1.2em; margin-bottom: 15px; }
    textarea { width: 100%; flex-grow: 1; min-height: 400px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; resize: vertical; font-size: 1em; line-height: 1.6; box-sizing: border-box; font-family: inherit; }
    #output-area { width: 100%; flex-grow: 1; min-height: 400px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; white-space: pre-wrap; font-size: 1.05em; line-height: 1.8; box-sizing: border-box; overflow-y: auto; outline: none; }
    .btn { display: block; width: 100%; padding: 18px; color: white; border: none; font-size: 1.1em; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 20px; transition: background 0.3s; }
    .btn-convert { background: #27ae60; }
    .btn-convert:hover { background: #219150; }
    .btn-copy { background: #2980b9; }
    .btn-copy:hover { background: #1f6391; }
</style>
</head>
<body>

<h1>📝 네이버 블로그 포스팅 구조화 도구</h1>
<div class="instruction">
    <b>안내:</b> 클로바노트 녹음 스크립트나 작성하신 멘토링 메모 원문을 좌측에 입력하십시오. 하단의 변환 버튼을 누르면, 네이버 스마트에디터에 그대로 복사·붙여넣기 할 수 있는 블로그 최적화 포맷(도입-본문-결론 구조)으로 재배치됩니다.
</div>

<div class="container">
    <!-- 입력부 -->
    <div class="panel">
        <h3>📥 원문 입력 (Raw Data)</h3>
        <textarea id="raw-text" placeholder="여기에 클로바노트 스크립트나 회의 메모, 아이디어 스케치를 편하게 붙여넣으세요..."></textarea>
        <button class="btn btn-convert" onclick="formatText()">블로그 포맷으로 구조화하기 ➔</button>
    </div>

    <!-- 출력부 -->
    <div class="panel">
        <h3>📤 블로그 포맷 출력 (Draft)</h3>
        <div id="output-area" contenteditable="true">변환된 내용이 여기에 표시됩니다. 텍스트를 직접 수정할 수도 있습니다.</div>
        <button class="btn btn-copy" onclick="copyToClipboard()">📋 결과물 전체 복사하기</button>
    </div>
</div>

<script>
function formatText() {
    const raw = document.getElementById('raw-text').value.trim();
    if(!raw) {
        alert('구조화할 원문을 좌측에 입력해 주십시오.');
        return;
    }

    // 단락별 분리 및 공백 제거
    const paragraphs = raw.split('\n').map(p => p.trim()).filter(p => p !== '');
    
    // 구조화 템플릿 생성
    let formatted = `[제목 제안]: 현장에서 마주한 질문들, 그리고 실질적인 해법\n\n`;
    
    formatted += `■ 시작하며\n`;
    formatted += `현장에서 기업들을 만나다 보면 겉으로 드러난 현상 이면에 숨겨진 진짜 문제들을 마주하게 됩니다. 오늘 나눈 고민과 해결의 과정을 정리해 봅니다.\n\n`;
    
    formatted += `■ 기업 현황 및 주요 논의 사항\n`;
    // 원문의 전반부를 현황으로 배치
    const oneThird = Math.ceil(paragraphs.length / 3);
    const introText = paragraphs.slice(0, oneThird);
    introText.forEach(text => {
        formatted += `· ${text}\n`;
    });
    formatted += `\n`;

    formatted += `■ 핵심 진단 및 컨설팅 내용\n`;
    // 원문의 중반부를 해결책(개조식)으로 배치
    const twoThirds = Math.ceil(paragraphs.length * 2 / 3);
    const bodyText = paragraphs.slice(oneThird, twoThirds);
    bodyText.forEach(text => {
        formatted += `✔️ ${text}\n`;
    });
    formatted += `\n`;

    formatted += `■ 맺음말 및 시사점\n`;
    // 원문의 후반부를 결론으로 배치
    const conclusionText = paragraphs.slice(twoThirds).join(' ');
    formatted += `${conclusionText}\n\n`;
    formatted += `본질을 놓치지 않는 단단한 성장을 응원합니다.\n\n`;
    
    formatted += `[해시태그 추천]\n`;
    formatted += `#수출컨설팅 #경영지도사 #기업성장 #문제해결 #오주현 #공공조달\n`;

    // 결과 출력
    document.getElementById('output-area').innerText = formatted;
}

function copyToClipboard() {
    const output = document.getElementById('output-area').innerText;
    if(output.startsWith('변환된 내용이') || !output) {
        alert('복사할 내용이 없습니다. 먼저 원문을 변환해 주십시오.');
        return;
    }
    
    navigator.clipboard.writeText(output).then(() => {
        alert('블로그 포맷이 클립보드에 복사되었습니다. 네이버 블로그 작성 창에 붙여넣기(Ctrl+V) 하십시오.');
    }).catch(err => {
        alert('복사에 실패했습니다: ' + err);
    });
}
</script>
</body>
</html>
