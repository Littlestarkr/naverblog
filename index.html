<script>
function formatText() {
    const raw = document.getElementById('raw-text').value.trim();
    if(!raw) {
        alert('구조화할 원문을 좌측에 입력해 주십시오.');
        return;
    }

    // 단락별 분리 및 공백 제거
    const paragraphs = raw.split('\n').map(p => p.trim()).filter(p => p !== '');
    
    // 구조화 템플릿 생성
    let formatted = `<b>[제목 제안]: 현장에서 마주한 질문들, 그리고 실질적인 해법</b>\n\n`;
    
    formatted += `<b>■ 시작하며</b>\n`;
    formatted += `현장에서 기업들을 만나다 보면 겉으로 드러난 현상 이면에 숨겨진 진짜 문제들을 마주하게 됩니다. 오늘 나눈 고민과 해결의 과정을 정리해 봅니다.\n\n`;
    
    formatted += `<b>■ 기업 현황 및 주요 논의 사항</b>\n`;
    // 원문의 전반부를 현황으로 배치
    const oneThird = Math.ceil(paragraphs.length / 3);
    const introText = paragraphs.slice(0, oneThird);
    introText.forEach(text => {
        formatted += `· ${text}\n`;
    });
    formatted += `\n`;

    formatted += `<b>■ 핵심 진단 및 컨설팅 내용</b>\n`;
    // 원문의 중반부를 해결책(개조식)으로 배치
    const twoThirds = Math.ceil(paragraphs.length * 2 / 3);
    const bodyText = paragraphs.slice(oneThird, twoThirds);
    bodyText.forEach(text => {
        formatted += `✔️ ${text}\n`;
    });
    formatted += `\n`;

    formatted += `<b>■ 맺음말 및 시사점</b>\n`;
    // 원문의 후반부를 결론으로 배치
    const conclusionText = paragraphs.slice(twoThirds).join(' ');
    formatted += `${conclusionText}\n\n`;
    formatted += `본질을 놓치지 않는 단단한 성장을 응원합니다.\n\n`;
    
    formatted += `<span style="color:#888;">[해시태그 추천]\n#수출컨설팅 #경영지도사 #기업성장 #문제해결 #오주현 #공공조달</span>\n\n`;

    // 1. 링크 변환 규칙: [텍스트](URL) 형태를 HTML 링크로 변환
    formatted = formatted.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" style="color:#0066cc; text-decoration:underline;">$1</a>');

    // 2. 이미지 위치 표시 규칙: [이미지] 형태를 시각적 박스로 변환
    formatted = formatted.replace(/\[이미지\]/g, '<div style="background:#f1f3f5; padding:20px; text-align:center; border:2px dashed #adb5bd; border-radius:5px; margin:15px 0; color:#495057; font-weight:bold;">📸 네이버 블로그에서 이 위치에 이미지를 첨부하세요</div>');

    // 3. 마크다운 볼드체(**) 변환 규칙: **강조할 내용** 형태를 HTML 굵은 글씨(<b>)로 변환
    formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

    // 4. 텍스트의 줄바꿈을 HTML 줄바꿈(<br>)으로 변환하여 출력영역(innerHTML)에 삽입
    document.getElementById('output-area').innerHTML = formatted.replace(/\n/g, '<br>');
}

function copyToClipboard() {
    const outputArea = document.getElementById('output-area');
    const outputText = outputArea.innerText;
    
    if(outputText.startsWith('변환된 내용이') || !outputText.trim()) {
        alert('복사할 내용이 없습니다. 먼저 원문을 변환해 주십시오.');
        return;
    }
    
    // 순수 텍스트가 아닌 '서식이 포함된 HTML(Rich Text)' 자체를 드래그해서 복사하는 효과를 내는 로직
    const selection = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(outputArea);
    selection.removeAllRanges();
    selection.addRange(range);

    try {
        // 선택된 영역을 클립보드에 복사
        document.execCommand('copy');
        alert('✅ 서식과 링크가 유지된 채 복사되었습니다. 네이버 블로그(또는 앱) 작성 창에 붙여넣기 하십시오.');
    } catch (err) {
        alert('복사에 실패했습니다: ' + err);
    }
    
    // 복사 완료 후 화면의 드래그(선택) 영역 깔끔하게 해제
    selection.removeAllRanges();
}
</script>
